name: Convert & Edit

on:
  workflow_dispatch:
  schedule:
    - cron: "30 * * * *"  # 每小时运行一次

permissions:
  actions: write
  contents: read  # 确保有权限读取内容

jobs:
  ForkRepository:
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Shanghai'

    steps: 
    - name: Checkout the repository
      uses: actions/checkout@v3  # 使用稳定版本
      with:
        repository: Moli-X/Tool
        path: Tool-repo
        token: ${{ secrets.PAT_TOKEN }}

    - name: Define scripts information
      id: define_scripts
      run: |
        # 定义多个脚本的链接和名称
        echo "[nicegram]=\"https://raw.githubusercontent.com/chxm1023/Rewrite/main/nicegram.js\"" >> $GITHUB_ENV
        echo "[sjthly]=\"https://raw.githubusercontent.com/89996462/Quantumult-X/main/ycdz/sjthly.js\"" >> $GITHUB_ENV
        echo "[snow]=\"https://raw.githubusercontent.com/chxm1023/Rewrite/main/snow.js\"" >> $GITHUB_ENV

    - name: Prepare conversion script
      run: |
        set -e  # 遇到错误时立即退出
        # 创建目标文件夹，如果不存在则创建
        mkdir -p Tool-repo/Tool/Loon/Plugin/Convert
        echo "Target folder Tool-repo/Tool/Loon/Plugin/Convert exists: $(ls -ld Tool-repo/Tool/Loon/Plugin/Convert)"
        
        # 定义下载和转换的函数
        download_and_convert() {
          script_url=$1
          script_name=$2
          
          # 创建转换后的文件
          echo "[Script]" > Tool-repo/Tool/Loon/Plugin/Convert/$script_name.plugin
          echo "http-response ^https:\/\/.* url script-path=$script_url, requires-body=true, timeout=60, tag=$script_name" >> Tool-repo/Tool/Loon/Plugin/Convert/$script_name.plugin
          echo "" >> Tool-repo/Tool/Loon/Plugin/Convert/$script_name.plugin
          echo "[MITM]" >> Tool-repo/Tool/Loon/Plugin/Convert/$script_name.plugin
          echo "hostname = $(echo $script_url | sed -E 's|https?://([^/]+).*|\1|')" >> Tool-repo/Tool/Loon/Plugin/Convert/$script_name.plugin

          echo "Converted and saved to Tool-repo/Tool/Loon/Plugin/Convert/$script_name.plugin"
        }

        # 获取脚本信息
        SCRIPT_URLS=(
          "https://raw.githubusercontent.com/chxm1023/Rewrite/main/nicegram.js"
          "https://raw.githubusercontent.com/89996462/Quantumult-X/main/ycdz/sjthly.js"
          "https://raw.githubusercontent.com/chxm1023/Rewrite/main/snow.js"
        )
        
        SCRIPT_NAMES=("nicegram" "sjthly" "snow")

        # 并行下载并转换每个脚本
        for i in ${!SCRIPT_URLS[@]}; do
          script_name=${SCRIPT_NAMES[$i]}
          script_url=${SCRIPT_URLS[$i]}
          
          # 在后台执行每个脚本的转换，不下载 .js 文件
          download_and_convert $script_url $script_name &
        done

        # 等待所有后台任务完成
        wait
        echo "All scripts have been converted."

    - name: Upload Converted Scripts
      uses: actions/upload-artifact@v3
      with:
        name: converted-scripts
        path: Tool-repo/Tool/Loon/Plugin/Convert/

###### Commit
    - name: 添加Commits
      run: |
        cd Tool-repo
        if [[ -n $(git status -s) ]]; then
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Update $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')"
          git push origin HEAD
        else
          echo "No changes to commit."
        fi

    - name: 清理Workflow
      uses: Mattraks/delete-workflow-runs@main
      with:
        token: ${{ secrets.PAT_TOKEN }} 
        retain_days: 0
        keep_minimum_runs: 2
